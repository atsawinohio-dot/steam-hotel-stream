<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>ควบคุมช่อง 21 · ROYS Hotel</title>
<style>
  :root {
    --bg: #0b1020; --panel: #151c33; --line: #26304f; --text: #e8ecf7; --muted: #93a0c2;
    --red: #ff4d5e; --green: #34d399; --amber: #fbbf24; --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 17px; font-weight: 600; margin: 4px 0 14px; color: var(--muted); }
  h1 b { color: var(--text); }
  .banner { border-radius: 16px; padding: 18px; margin-bottom: 14px; background: var(--panel);
    border: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .banner .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--muted); flex: none; }
  .banner.live { border-color: var(--red); background: #2a0f18; }
  .banner.live .dot { background: var(--red); box-shadow: 0 0 0 6px #ff4d5e33; animation: pulse 1.6s infinite; }
  .banner.wait .dot { background: var(--amber); }
  .banner .big { font-size: 22px; font-weight: 700; }
  .banner .sub { color: var(--muted); font-size: 14px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 11px #ff4d5e00; } }
  .preview { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9;
    border: 1px solid var(--line); margin-bottom: 8px; }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .preview .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .preview .age { position: absolute; right: 8px; bottom: 8px; background: #000a; padding: 2px 8px; border-radius: 99px;
    font-size: 12px; color: #fff; }
  .meter { display: flex; align-items: center; gap: 10px; margin: 0 2px 14px; font-size: 13px; color: var(--muted); }
  .meter .bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter .fill { height: 100%; width: 0; background: var(--green); transition: width .4s; }
  .meter .fill.hot { background: var(--red); } .meter .fill.low { background: var(--amber); }
  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
  .main-btn { width: 100%; padding: 18px; font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .main-btn.start { background: var(--red); color: #fff; }
  .main-btn.stop { background: #3a4466; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .row button { background: var(--panel); border: 1px solid var(--line); padding: 14px 10px; font-size: 15px; }
  .row button.on { border-color: var(--amber); background: #2b2310; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; margin-bottom: 14px; }
  .item { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .item:last-child { border-bottom: 0; }
  .item span:first-child { color: var(--muted); }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
  .quota { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 2px 0 10px; }
  .quota div { height: 100%; background: var(--blue); width: 0; }
  .alerts { margin-bottom: 14px; }
  .alert { background: #2b2310; border: 1px solid #5b4a17; color: #fde68a; border-radius: 12px; padding: 10px 12px;
    margin-bottom: 8px; font-size: 14px; }
  .alert.red { background: #2a0f18; border-color: #6b1d2a; color: #fecdd3; }
  .pending { font-size: 13px; color: var(--amber); min-height: 18px; margin: -4px 2px 10px; }
  .login { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin-top: 30px; }
  .login input { width: 100%; font: inherit; font-size: 18px; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); margin: 12px 0; }
  .login button { width: 100%; padding: 14px; background: var(--blue); color: #06122b; font-weight: 700; font-size: 17px; }
  .err { color: var(--red); font-size: 14px; min-height: 20px; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><b>ROYS Hotel</b> · ควบคุมช่อง 21 Event</h1>

  <section id="login" class="login" hidden>
    <div style="font-size:18px;font-weight:700">เข้าสู่ระบบ</div>
    <form id="loginForm">
      <input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
      <div class="err" id="loginErr"></div>
      <button type="submit">เข้าสู่ระบบ</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="banner" id="banner"><div class="dot"></div><div><div class="big" id="bigStatus">กำลังโหลด…</div><div class="sub" id="subStatus"></div></div></div>

    <div class="alerts" id="alerts"></div>

    <div class="preview">
      <img id="preview" alt="ภาพตัวอย่างจาก OBS" hidden>
      <div class="empty" id="previewEmpty">ยังไม่มีภาพตัวอย่าง</div>
      <div class="age" id="previewAge" hidden></div>
    </div>
    <div class="meter"><span>🎤</span><div class="bar"><div class="fill" id="meterFill"></div></div><span id="meterDb">–</span></div>

    <button class="main-btn start" id="mainBtn" disabled>▶ เริ่มถ่ายทอดสด</button>
    <div class="pending" id="pending"></div>
    <div class="row">
      <button id="micBtn" disabled>🎤 ปิดไมค์</button>
      <button id="standbyBtn" disabled>⏸ ภาพพักรอ</button>
    </div>
    <div class="row">
      <button id="camBtn" disabled>📱 ใช้กล้องมือถือ</button>
    </div>

    <div class="card" id="health"></div>
    <div class="foot">อัปเดตอัตโนมัติทุก 4 วินาที · หน้าจอนี้กินโควตาเฉพาะตอนเปิดดูอยู่</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = null, timer = null, lastPreviewAt = 0, busy = false;

async function api(path, opts = {}) {
  const res = await fetch("/control/api/" + path, { credentials: "same-origin", ...opts });
  if (res.status === 401) { showLogin(); throw new Error("login"); }
  return res.json();
}

function showLogin() { $("app").hidden = true; $("login").hidden = false; clearTimeout(timer); $("pw").focus(); }
function showApp() { $("login").hidden = true; $("app").hidden = false; }

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  const res = await fetch("/control/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("pw").value }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { $("loginErr").textContent = data.error || "เข้าสู่ระบบไม่สำเร็จ"; return; }
  $("pw").value = ""; showApp(); poll();
};

async function send(action, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  busy = true; render();
  try { await api("command", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action }) }); }
  finally { busy = false; poll(); }
}

$("mainBtn").onclick = () => {
  const on = isOn();
  send(on ? "stop" : "start", on ? "หยุดถ่ายทอดสดช่อง 21 ใช่ไหม?\nทีวีทุกห้องจะขึ้นว่าช่องไม่พร้อมใช้งาน" : "");
};
$("micBtn").onclick = () => send(state?.agent?.micMuted ? "unmute" : "mute");
$("standbyBtn").onclick = () => send(state?.agent?.scene === "พักรอ" ? "camera" : "standby");
$("camBtn").onclick = () => send(state?.agent?.rig === "phone" ? "usbcam" : "phonecam");

function isOn() { const a = state?.agent; return !!(state?.channel?.live || a?.streaming); }
const ACTION_TH = { start: "เริ่มถ่ายทอดสด", stop: "หยุดถ่ายทอดสด", mute: "ปิดไมค์", unmute: "เปิดไมค์", standby: "ภาพพักรอ", camera: "กลับไปที่กล้อง" };
function ago(s) { return s == null ? "–" : s < 60 ? s + " วินาทีที่แล้ว" : Math.round(s / 60) + " นาทีที่แล้ว"; }
function fmtDur(s) { if (!s) return ""; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + " ชม. " : "") + m + " นาที"; }

function render() {
  if (!state) return;
  const ch = state.channel || {}, a = state.agent, laptopOnline = state.agentSecondsAgo != null && state.agentSecondsAgo < 90;
  const on = isOn(), standby = a?.scene === "พักรอ";

  const b = $("banner");
  b.className = "banner" + (ch.live ? " live" : a?.streaming ? " wait" : "");
  if (ch.offAirForBudget) { $("bigStatus").textContent = "หยุดออกอากาศ: โควตาวันนี้หมด"; $("subStatus").textContent = "กลับมาได้หลัง 07:00 น."; }
  else if (ch.live) { $("bigStatus").textContent = standby ? "ออกอากาศ · ภาพพักรอ" : "กำลังออกอากาศ"; $("subStatus").textContent = a?.streamSeconds ? "ออกอากาศมาแล้ว " + fmtDur(a.streamSeconds) : "ทีวีจะช้ากว่าจริงราว 20–30 วินาที"; }
  else if (a?.streaming) { $("bigStatus").textContent = "กำลังเริ่ม…"; $("subStatus").textContent = "รอภาพชุดแรกขึ้นช่อง 21"; }
  else { $("bigStatus").textContent = "ไม่ได้ออกอากาศ"; $("subStatus").textContent = "ช่อง 21 ปิดอยู่"; }

  const mb = $("mainBtn");
  mb.className = "main-btn " + (on ? "stop" : "start");
  mb.textContent = on ? "■ หยุดถ่ายทอดสด" : "▶ เริ่มถ่ายทอดสด";
  mb.disabled = busy || !laptopOnline;
  $("micBtn").textContent = a?.micMuted ? "🎤 เปิดไมค์" : "🎤 ปิดไมค์";
  $("micBtn").className = a?.micMuted ? "on" : "";
  $("micBtn").disabled = busy || !laptopOnline || !a?.obs?.connected;
  // Labelled with what pressing it does, not with what is on air now.
  const onPhone = a?.rig === "phone";
  $("camBtn").textContent = onPhone ? "🎥 ใช้กล้อง USB" : "📱 ใช้กล้องมือถือ";
  $("camBtn").className = onPhone ? "on" : "";
  $("camBtn").disabled = busy || !laptopOnline || !a?.obs?.connected;
  $("standbyBtn").textContent = standby ? "📷 กลับไปที่กล้อง" : "⏸ ภาพพักรอ";
  $("standbyBtn").className = standby ? "on" : "";
  $("standbyBtn").disabled = busy || !laptopOnline || !a?.obs?.connected;
  $("pending").textContent = (state.pending || []).map((p) => "⏳ รอโน้ตบุ๊กทำคำสั่ง: " + ACTION_TH[p.action]).join(" · ");

  const alerts = [];
  if (!laptopOnline) alerts.push(["red", "โน้ตบุ๊กออฟไลน์ — ต้องเปิดไฟล์ “ROYS Event Control” บนโน้ตบุ๊กก่อน ถึงจะสั่งงานจากหน้านี้ได้"]);
  if (laptopOnline && a && !a.camo?.connected) alerts.push(["", "มือถือยังไม่เชื่อมกับ Camo — เปิดแอป Camo บนมือถือค้างไว้ (จอต้องไม่ดับ)"]);
  if (laptopOnline && a && !a.obs?.connected) alerts.push(["", "ยังคุยกับ OBS ไม่ได้ — ระบบกำลังเปิด OBS ให้"]);
  if (ch.live && a && !a.micMuted && a.micDb != null && a.micDb < -50) alerts.push(["", "เสียงไมค์เบามาก — เช็กว่ามือถืออยู่ใกล้ผู้พูด"]);
  if (ch.live && a?.micMuted) alerts.push(["", "ไมค์ปิดอยู่ — ทีวีจะไม่มีเสียง"]);
  if (a?.lastError) alerts.push(["", "โน้ตบุ๊กแจ้ง: " + a.lastError]);
  if ((ch.requestsToday || 0) > 60000 && !ch.offAirForBudget) alerts.push(["", "โควตาวันนี้ใกล้หมด ช่อง 21 จะหยุดเองเมื่อครบ"]);
  $("alerts").innerHTML = "";
  for (const [cls, msg] of alerts) { const d = document.createElement("div"); d.className = "alert " + cls; d.textContent = msg; $("alerts").appendChild(d); }

  if (state.previewAt && state.previewAt !== lastPreviewAt) {
    lastPreviewAt = state.previewAt;
    $("preview").src = "/control/api/preview.jpg?t=" + state.previewAt;
    $("preview").hidden = false; $("previewEmpty").hidden = true;
  }
  if (state.previewAt) { $("previewAge").hidden = false; $("previewAge").textContent = "ภาพเมื่อ " + ago(Math.round((state.now - state.previewAt) / 1000)); }

  const db = a?.micDb, fill = $("meterFill");
  const pct = db == null ? 0 : Math.max(0, Math.min(100, (db + 60) / 60 * 100));
  fill.style.width = (a?.micMuted ? 0 : pct) + "%";
  fill.className = "fill" + (db > -6 ? " hot" : db < -45 ? " low" : "");
  $("meterDb").textContent = a?.micMuted ? "ปิดไมค์" : db == null ? "–" : Math.round(db) + " dB";

  const used = ch.requestsToday || 0, budget = ch.dailyBudget || 85000;
  const yes = (v, t, f) => `<span class="${v ? "ok" : "bad"}">${v ? t : f}</span>`;
  $("health").innerHTML = `
    <div class="item"><span>โน้ตบุ๊ก</span>${yes(laptopOnline, "ออนไลน์ · " + ago(state.agentSecondsAgo), "ออฟไลน์")}</div>
    <div class="item"><span>OBS</span>${yes(a?.obs?.connected, a?.streaming ? "กำลังส่งภาพ" : "พร้อม", a?.obs?.running ? "เปิดอยู่ แต่ยังเชื่อมไม่ได้" : "ปิดอยู่")}</div>
    <div class="item"><span>มือถือ (Camo)</span>${yes(a?.camo?.connected, "เชื่อมอยู่" + (a?.camo?.device ? " · " + a.camo.device : ""), a?.camo?.running ? "ยังไม่เชื่อม" : "Camo Studio ปิดอยู่")}</div>
    <div class="item"><span>ฉากตอนนี้</span><span>${a?.scene ? (a.scene === "พักรอ" ? "ภาพพักรอ" : "กล้อง") : "–"}</span></div>
    <div class="item" style="display:block"><div style="display:flex;justify-content:space-between"><span style="color:var(--muted)">โควตาวันนี้</span><span>${used.toLocaleString()} / ${budget.toLocaleString()}</span></div><div class="quota"><div style="width:${Math.min(100, used / budget * 100)}%"></div></div></div>`;
}

async function poll() {
  clearTimeout(timer);
  if (document.hidden) return; // don't spend requests on a tab nobody is looking at
  try { state = await api("state"); showApp(); render(); }
  catch (e) { if (e.message === "login") return; }
  timer = setTimeout(poll, 4000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();
</script>
</body>
</html>

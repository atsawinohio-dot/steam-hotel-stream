name = "steam-hotel-asiangames"
main = "worker.js"
compatibility_date = "2026-07-01"

[[kv_namespaces]]
binding = "ASIANGAMES_STATE"
id = "a51f2769a29a43d5a77b895055bc09a0"

# A plain fetch() to another Worker on this account's workers.dev subdomain
# comes back 404 — the subrequest routes back into this Worker instead of the
# target, and hits its catch-all. PPTV is reached through this binding instead.
[[services]]
binding = "PPTV_PROXY"
service = "steam-hotel-pptv-proxy"

[[services]]
binding = "THAIRATH_PROXY"
service = "steam-hotel-thairath-proxy"
